user www-data;
worker_processes auto;
pid /run/morning-web.pid;
error_log /var/log/nginx/morning-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    server {
        listen 127.0.0.1:80;
        server_name morning.atuls.me;
        root /opt/morning/current/web;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store";
        }

        location = /deployment.json {
            alias /opt/morning/current/deployment.json;
            add_header Cache-Control "no-store";
        }

        location /assets/ {
            try_files $uri @previous_asset;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location @previous_asset {
            root /opt/morning/previous/web;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            if (!-f /opt/morning/current/web/index.html) {
                return 503;
            }
            try_files $uri $uri/ /index.html;
        }
    }
}
