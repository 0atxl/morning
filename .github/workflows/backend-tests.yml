name: Backend tests
run-name: Backend tests at ${{ inputs.revision || github.sha }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Git revision to test (defaults to the dispatched commit)
        required: false
        type: string

permissions:
  contents: read

jobs:
  backend:
    name: Go fixture suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Record the tested commit
        run: git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Run all backend tests
        working-directory: server
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: local
        run: go test -count=1 -v ./...
