name: Read-only lookup fixtures
run-name: Read-only lookup fixtures at ${{ inputs.revision || github.sha }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Approved Git revision to test
        required: false
        type: string

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the approved revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Record the tested commit
        run: git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Run only Go lookup fixtures
        working-directory: server
        env:
          GOPROXY: 'off'
          GOTOOLCHAIN: local
        run: go test -count=1 -v -run '^TestLookup' ./...

      - name: Run only browser snapshot fixtures
        run: node --experimental-strip-types --test web/tests/lookup-result.test.ts
